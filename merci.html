<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Merci pour ta commande – FCMQ</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:linear-gradient(160deg,#000000 0%,#1a1a1a 60%,#000000 100%);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.card{max-width:440px}
.emoji{font-size:48px;margin-bottom:16px}
.merci-logo{max-width:160px;width:60%;margin:0 auto 18px;display:block}
h1{font-family:'DM Serif Display',serif;font-size:30px;font-weight:400;margin-bottom:12px}
p{font-size:14px;color:rgba(255,255,255,0.75);line-height:1.6;margin-bottom:20px}
a{display:inline-block;background:#1d9ad7;color:#111110;text-decoration:none;padding:12px 24px;border-radius:8px;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:0.05em}
</style>
</head>
<body>
<div class="card">
  <img src="images/logo-fcmq.png" alt="FCMQ" class="merci-logo">
  <h1>Merci pour ta commande!</h1>
  <p>Ton paiement a été reçu. Un courriel de confirmation s'en vient. On prépare ta commande!</p>
  <a href="/">Retour à la boutique</a>
</div>

<script>
// ── Notification de commande (EmailJS) ──────────────────────────────────
// Ces identifiants ne sont pas secrets (clé publique EmailJS) : ils
// autorisent uniquement l'envoi via le template configuré, avec des
// destinataires déjà fixés dans EmailJS — pas de risque à les exposer ici.
var EMAILJS_PUBLIC_KEY  = 'v2EsCCD55O3D8WsVc';
var EMAILJS_SERVICE_ID  = 'service_oqeqqsn';
var EMAILJS_TEMPLATE_ID = 'xdbdnv3';

(function(){ emailjs.init({ publicKey: EMAILJS_PUBLIC_KEY }); })();

// Même catalogue/prix que index.html, pour recalculer les mêmes totaux
var PRODUCTS = {
  tshirt:    { name: 'T-Shirt',   price: 29.00 },
  crewneck:  { name: 'Crewneck',  price: 35.00 },
  hoodie:    { name: 'Hoodie',    price: 49.00 },
  tuque:     { name: 'Tuque',     price: 29.00 },
  casquette: { name: 'Casquette', price: 25.00 }
};
var BIG_SIZES = ['2XL', '3XL', '4XL'];
var SURCHARGE = 5.00;
var LIVRAISON = 15.00;
var TPS_RATE = 0.05;
var TVQ_RATE = 0.09975;

function unitPrice(prod, size) {
  return prod.price + (BIG_SIZES.indexOf(size) !== -1 ? SURCHARGE : 0);
}

function sendOrderNotification() {
  var raw;
  try { raw = localStorage.getItem('fcmq-cart'); } catch (e) { raw = null; }
  if (!raw) return; // rien à envoyer (ex: page rechargée après coup, ou visite directe)

  var cart;
  try { cart = JSON.parse(raw); } catch (e) { cart = null; }
  if (!Array.isArray(cart) || cart.length === 0) return;

  var subtotal = 0;
  var orders = cart.map(function (it) {
    var prod = PRODUCTS[it.id];
    if (!prod) return null;
    var unit = unitPrice(prod, it.size);
    var lineTotal = unit * it.qty;
    subtotal += lineTotal;
    return {
      name: prod.name + (it.color ? ' — ' + it.color : '') + ' — Grandeur ' + it.size,
      units: it.qty,
      price: lineTotal.toFixed(2)
    };
  }).filter(Boolean);

  if (orders.length === 0) return;

  var avantTaxes = subtotal + LIVRAISON;
  var tps = avantTaxes * TPS_RATE;
  var tvq = avantTaxes * TVQ_RATE;
  var taxes = tps + tvq;

  var qp = window.location.search ? new URLSearchParams(window.location.search) : null;
  var sessionId = qp ? (qp.get('session_id') || qp.get('orderId') || qp.get('transactionId')) : null;
  var orderId = sessionId ? sessionId.slice(-8).toUpperCase() : Date.now().toString().slice(-8);

  var customer = {};
  try { customer = JSON.parse(localStorage.getItem('fcmq-customer') || '{}'); } catch (e) {}

  var templateParams = {
    order_id: orderId,
    orders: orders,
    customer_name: customer.name || '',
    customer_address: customer.adresse || '',
    customer_city: [customer.ville, customer.province].filter(Boolean).join(', '),
    customer_CP: customer.codepostal || '',
    customer_phone: customer.phone || '',
    email: customer.email || '',
    shipping_method: 'Postes Canada',
    cost: {
      shipping: LIVRAISON.toFixed(2),
      tax: taxes.toFixed(2)
    }
  };

  emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, templateParams)
    .then(function () {
      try {
        localStorage.removeItem('fcmq-cart');
        localStorage.removeItem('fcmq-customer');
      } catch (e) {}
    })
    .catch(function (err) {
      // Silencieux pour le client — il a déjà payé et vu la confirmation.
      // (Stripe reste la source de vérité pour la commande.)
      console.error('Notification de commande non envoyée:', err);
    });
}

sendOrderNotification();
</script>
</body>
</html>
